{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Dashboard | Smart Clinic{% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside class="dashboard-sidebar">

            <div class="dashboard-logo">
                Smart Clinic
            </div>

            <nav class="dashboard-nav">

                <a href="#">
                    Dashboard
                </a>

                <a href="#">
                    Patients
                </a>

                <a href="#">
                    Appointments
                </a>

                <a href="#">
                    Medical Records
                </a>

                <a href="#">
                    Prescriptions
                </a>

                <a href="#">
                    Availability
                </a>

            </nav>

            <div class="dashboard-nav-bottom">

                <a href="#">
                    Profile
                </a>

                <a href="#">
                    Logout
                </a>

            </div>

        </aside>


        <!-- Main Area -->
        <div class="dashboard-main">

            <header class="dashboard-header">

                <div>
                    <h1>
                        {% block page_heading %}
                        Dashboard
                        {% endblock %}
                    </h1>
                </div>

                <div class="dashboard-user">
                    User
                </div>

            </header>


            <main class="dashboard-content">

                {% block content %}
                {% endblock %}

            </main>

        </div>

    </div>

</body>

</html>
